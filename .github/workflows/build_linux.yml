name: 'Linux'

on:
  push:
    branches: [ master, development ]
    paths-ignore:
      - 'AdditionalFiles/**'
      - '**.md'
  pull_request:
    branches: [ master, development ]
    paths-ignore:
      - 'AdditionalFiles/**'
      - '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install-deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libopenal-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev uuid-dev

      - name: build-genie
        run: |
          git clone --depth 1 https://github.com/bkaradzic/GENie "$RUNNER_TEMP/genie"
          make -C "$RUNNER_TEMP/genie" -j$(nproc)
          cp "$RUNNER_TEMP/genie/bin/linux/genie" scripts/

      # Dependencies only need rebuilding when a submodule, the build script (which pins shaderc), or the OS image changes
      - name: dependencies-cache-key
        id: deps-key
        run: echo "submodules=$(git submodule status | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: cache-dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            FlexEngine/lib/x64/Debug
            FlexEngine/dependencies/shaderc/libshaderc/include
          key: deps-${{ env.ImageOS }}-${{ hashFiles('scripts/build_dependencies.py') }}-${{ steps.deps-key.outputs.submodules }}

      - name: build-dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: cd scripts && python3 build_dependencies.py linux ninja Debug

      - name: generate-project
        run: cd scripts && ./genie ninja

      - name: build
        run: ninja -C build/debug64

      - name: compress-artifacts
        run: zip -r Flex.zip -j bin/Debug_x64/FlexEngine/

      - name: upload-artifacts
        uses: actions/upload-artifact@v6
        with:
          name: flex-linux
          path: Flex.zip
          retention-days: 2
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: install-deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenal1

      - name: download-artifacts
        uses: actions/download-artifact@v7
        with:
          name: flex-linux
          path: .

      - name: decompress-artifacts
        run: unzip Flex.zip

      - name: run-tests
        run: |
          chmod +x Flex
          ./Flex --test --headless
